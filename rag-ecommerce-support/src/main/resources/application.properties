spring.application.name=rag-ecommerce-support

# Pinecone
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE}

# Google GenAI
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai

spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL}
spring.ai.google.genai.embedding.text.dimensions=${GEMINI_EMBEDDING_DIMENSIONS}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL}
